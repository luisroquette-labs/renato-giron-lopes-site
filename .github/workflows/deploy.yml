name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm install
      # Cacheia as fontes do next/font/google baixadas no build (evita re-download a cada run).
      - uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4
        with:
          path: .next/cache
          key: nextcache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Build static export (retry p/ flakiness de rede do next/font no CI)
        # next/font/google baixa as fontes no build; o runner às vezes dá timeout.
        # 3 tentativas com backoff; falha de verdade se todas falharem (não esconde erro).
        run: npm run build || (sleep 8 && npm run build) || (sleep 16 && npm run build)
        env:
          NEXT_PUBLIC_BASE_PATH: /renato-giron-lopes-site
          NEXT_PUBLIC_SITE_URL: https://luisroquette-labs.github.io/renato-giron-lopes-site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
