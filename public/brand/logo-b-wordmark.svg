<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" role="img" aria-label="Renato Giron Lopes">
  <defs>
    <linearGradient id="b-fiber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1fe090"/>
      <stop offset="1" stop-color="#2dd4ea"/>
    </linearGradient>
  </defs>
  <!-- wordmark em duas pesagens -->
  <text x="15" y="34" font-family="'Space Grotesk',Inter,system-ui,sans-serif" font-size="21" font-weight="700" letter-spacing="1" fill="#eef2f0">RENATO</text>
  <text x="106" y="34" font-family="'Space Grotesk',Inter,system-ui,sans-serif" font-size="21" font-weight="400" letter-spacing="1" fill="#c2c9c5">GIRON LOPES</text>
  <!-- linha de enlace fina, com nó emissor à esquerda e nó-pulso à direita, longe do texto -->
  <g>
    <circle cx="16" cy="49" r="3" fill="#1fe090"/>
    <line x1="22" y1="49" x2="300" y2="49" stroke="url(#b-fiber)" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
    <circle cx="308" cy="49" r="4" fill="#2dd4ea"/>
    <circle cx="308" cy="49" r="8" fill="none" stroke="#2dd4ea" stroke-width="1.1" opacity="0.4"/>
    <circle cx="308" cy="49" r="12.5" fill="none" stroke="#2dd4ea" stroke-width="0.9" opacity="0.2"/>
  </g>
  <text x="16" y="64" font-family="Inter,system-ui,sans-serif" font-size="8.5" font-weight="600" letter-spacing="3.1" fill="#869089">ESPECIALISTA EM TELECOMUNICAÇÕES</text>
</svg>
