<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 72" role="img" aria-label="Renato Giron Lopes">
  <defs>
    <linearGradient id="c-fiber" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1fe090"/>
      <stop offset="1" stop-color="#2dd4ea"/>
    </linearGradient>
  </defs>
  <!-- símbolo: enlace óptico com ondas de sinal (eco do Sonar Grid) -->
  <g transform="translate(34 36)">
    <!-- ondas concêntricas emanando -->
    <path d="M 2 -16 A 16 16 0 0 1 2 16" fill="none" stroke="url(#c-fiber)" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
    <path d="M 6 -24 A 24 24 0 0 1 6 24" fill="none" stroke="#1fe090" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
    <path d="M 10 -31 A 31 31 0 0 1 10 31" fill="none" stroke="#2dd4ea" stroke-width="1.4" stroke-linecap="round" opacity="0.28"/>
    <!-- enlace: nó emissor -->
    <circle cx="-6" cy="0" r="6" fill="url(#c-fiber)"/>
    <circle cx="-6" cy="0" r="6" fill="none" stroke="#060809" stroke-width="1.4"/>
  </g>
  <!-- nome -->
  <text x="74" y="33" font-family="'Space Grotesk',Inter,system-ui,sans-serif" font-size="20" font-weight="700" letter-spacing="0.5" fill="#eef2f0">Renato Giron Lopes</text>
  <text x="75" y="52" font-family="Inter,system-ui,sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.3" fill="#869089">TELECOM · BACKBONE ÓPTICO · IP/MPLS</text>
</svg>
